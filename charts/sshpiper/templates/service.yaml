apiVersion: v1
kind: Service
metadata:
  name: {{ include "sshpiper.fullname" . }}
  labels:
    {{- include "sshpiper.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if .Values.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  {{- end }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 2222
      protocol: TCP
      name: sshpiper
  selector:
    {{- include "sshpiper.selectorLabels" . | nindent 4 }}
{{- if .Values.sshpiper.metrics.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-metrics" (include "sshpiper.fullname" . ) }}
  labels:
    {{- include "sshpiper.labels" . | nindent 4 }}
  {{- with .Values.sshpiper.metrics.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.sshpiper.metrics.service.type }}
  {{- if .Values.sshpiper.metrics.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ .Values.sshpiper.metrics.service.externalTrafficPolicy }}
  {{- end }}
  ports:
    - port: {{ .Values.sshpiper.metrics.service.port }}
      targetPort: 9000
      protocol: TCP
      name: metrics
  selector:
    {{- include "sshpiper.selectorLabels" . | nindent 4 }}
{{- end }}